name: Alertas de atraso

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar notificação de teste para todos os aparelhos"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node --test tests/late.test.mjs
      - run: node scripts/notify.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TESTE: ${{ inputs.teste }}
